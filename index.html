<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>尋寶遊戲</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; color: #1a73e8; font-size: 22px; margin-bottom: 15px; }
    
    .nav-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px; font-weight: bold; background: #e0e0e0; border: none; border-radius: 8px; cursor: pointer; color: #666; }
    .tab-btn.active { background: #1a73e8; color: white; }

    .my-team-card { background: linear-gradient(135deg, #1a73e8, #34a853); color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; display: none; }
    .my-team-card h2 { margin: 0 0 5px 0; font-size: 16px; font-weight: normal; }
    .my-team-card .team-badge { font-size: 20px; font-weight: bold; background: rgba(255,255,255,0.25); display: inline-block; padding: 4px 14px; border-radius: 20px; }

    .card { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    .form-group { margin-bottom: 12px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    
    button.btn-main { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; background-color: #1a73e8; margin-top: 5px; }
    button:disabled { background-color: #a5d6a7 !important; cursor: not-allowed; }

    .mode-switch { text-align: center; margin-top: 10px; font-size: 14px; }
    .mode-switch a { color: #1a73e8; font-weight: bold; text-decoration: none; cursor: pointer; }

    .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    .leaderboard-table th, .leaderboard-table td { padding: 8px; text-align: center; border-bottom: 1px solid #eee; }
    .leaderboard-table th { background: #f8f9fa; color: #666; }

    .treasure-item { background: white; padding: 15px; border-radius: 10px; margin-bottom: 12px; border-left: 5px solid #ff9800; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .treasure-item.found { border-left-color: #4caf50; background: #f1f8e9; }
    .distance-tag { font-size: 18px; font-weight: bold; color: #e65100; margin: 6px 0; }

    .admin-box { background: #fff3e0; border: 1px dashed #ff9800; padding: 12px; border-radius: 8px; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏴‍☠️ 尋寶遊戲</h1>

    <!-- 已登入資訊卡 -->
    <div id="myTeamCard" class="my-team-card">
      <h2>👤 <span id="mySavedName"></span></h2>
      <div class="team-badge">🚩 <span id="mySavedTeam"></span></div>
      <div><button onclick="logout()" style="background: rgba(255,255,255,0.2); border: 1px solid white; padding: 3px 10px; font-size: 12px; border-radius: 12px; color: white; margin-top: 8px;">🚪 登出帳號</button></div>
    </div>

    <!-- 功能頁籤 -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('joinTab')">📝 1. 報名與榜單</button>
      <button class="tab-btn" onclick="switchTab('hideTab')">🚩 2. 我要藏寶</button>
      <button class="tab-btn" onclick="switchTab('seekTab')">🔍 3. 開始尋寶</button>
    </div>

    <!-- 分頁 1：報名與戰績榜單 -->
    <div id="joinTab" class="tab-content">
      
      <!-- 登入/註冊區塊 -->
      <div id="authSection" class="card">
        
        <!-- 註冊表單 -->
        <div id="registerForm">
          <h3 style="margin-top:0;">新成員註冊選組</h3>
          <div class="form-group">
            <label>你的姓名：</label>
            <input type="text" id="regName" placeholder="例如：小明">
          </div>
          <div class="form-group">
            <label>選擇組別：</label>
            <select id="regTeam">
              <option value="第 1 組">第 1 組</option><option value="第 2 組">第 2 組</option>
              <option value="第 3 組">第 3 組</option><option value="第 4 組">第 4 組</option>
              <option value="第 5 組">第 5 組</option><option value="第 6 組">第 6 組</option>
              <option value="第 7 組">第 7 組</option>
            </select>
          </div>
          <div class="form-group">
            <label>設定帳號：</label>
            <input type="text" id="regAcc" placeholder="輸入方便記憶的帳號">
          </div>
          <div class="form-group">
            <label>設定密碼：</label>
            <input type="password" id="regPwd" placeholder="輸入密碼">
          </div>
          <button id="btnReg" class="btn-main" onclick="submitRegister()">確定註冊並鎖定組別</button>
          <div class="mode-switch">已經有帳號？<a onclick="toggleAuthMode('login')">點此直接登入</a></div>
        </div>

        <!-- 登入表單 -->
        <div id="loginForm" style="display:none;">
          <h3 style="margin-top:0;">帳號登入</h3>
          <div class="form-group">
            <label>帳號：</label>
            <input type="text" id="loginAcc" placeholder="請輸入帳號">
          </div>
          <div class="form-group">
            <label>密碼：</label>
            <input type="password" id="loginPwd" placeholder="請輸入密碼">
          </div>
          <button id="btnLogin" class="btn-main" style="background:#34a853;" onclick="submitLogin()">登入鎖定組別</button>
          <div class="mode-switch">還沒有帳號？<a onclick="toggleAuthMode('register')">點此前往註冊</a></div>
        </div>

      </div>

      <!-- 各組戰績競賽榜單 -->
      <div class="card">
        <h3 style="margin-top:0; color:#1a73e8;">🏆 各組寶藏戰績榜</h3>
        <button onclick="loadLeaderboard()" style="width:100%; background:#f0f2f5; border:1px solid #ccc; padding:6px; border-radius:5px; font-weight:bold; font-size:12px; margin-bottom:8px;">🔄 刷新榜單</button>
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>組別</th>
              <th>已藏寶數量</th>
              <th>尋獲寶物數</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody">
            <tr><td colspan="3">載入戰績中...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- 管理者後場重置專區 -->
      <div class="admin-box">
        <div style="font-weight:bold; font-size:13px; color:#e65100;">🔐 管理者後場專區</div>
        <div style="margin-top:6px; display:flex; gap:5px;">
          <button onclick="adminResetData('TREASURES_ONLY')" style="flex:1; background:#ff9800; color:white; border:none; padding:6px; font-size:12px; border-radius:5px; cursor:pointer;">🧹 僅清空藏寶紀錄</button>
          <button onclick="adminResetData('ALL')" style="flex:1; background:#d32f2f; color:white; border:none; padding:6px; font-size:12px; border-radius:5px; cursor:pointer;">💥 全面清空重置</button>
        </div>
      </div>

    </div>

    <!-- 分頁 2：我要藏寶 -->
    <div id="hideTab" class="tab-content" style="display:none;">
      <div class="card">
        <div class="form-group">
          <label>寶物名稱：</label>
          <input type="text" id="treasureName" placeholder="例如：黃金寶箱 #1">
        </div>
        <div class="form-group">
          <label>地點文字提示：</label>
          <textarea id="treasureHint" rows="2" placeholder="例如：在紅色溜滑梯正後方的草叢裡"></textarea>
        </div>
        <div class="form-group">
          <label>🔑 設定解鎖密碼：</label>
          <input type="text" id="treasurePassword" placeholder="例如：7788（現場實體寶物上貼的密碼）">
        </div>
        <div class="form-group">
          <label>GPS 定位座標：</label>
          <button type="button" onclick="getGPSLocation()" style="background:#34a853; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">📡 抓取當前 GPS 位置</button>
          <div id="gpsStatus" style="font-size:12px; color:#666; margin-top:5px;">尚未定位</div>
        </div>
        <button id="btnHide" class="btn-main" style="background:#e65100;" onclick="submitHideTreasure()">🚩 確定藏寶並送出定位</button>
      </div>
    </div>

    <!-- 分頁 3：開始尋寶 -->
    <div id="seekTab" class="tab-content" style="display:none;">
      <button onclick="loadTreasuresAndCalculate()" style="width:100%; background:#009688; color:white; border:none; padding:10px; border-radius:8px; font-weight:bold; margin-bottom:10px;">🔄 刷新尋寶雷達距離</button>
      <div id="treasuresList">載入寶物中...</div>
    </div>

  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwLKQj61SNKiy8wqLBJ3LSG4TmEi9bNx7gxB8iw-K2xkE7W9lbvqDenRQsfufJMPDYn/exec";
    let currentLat = 0, currentLng = 0;

    window.onload = () => { 
      checkSavedTeam(); 
      loadLeaderboard();
    };

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).style.display = 'block';
      event.target.classList.add('active');
      if (tabId === 'seekTab') loadTreasuresAndCalculate();
      if (tabId === 'joinTab') loadLeaderboard();
    }

    function toggleAuthMode(mode) {
      if (mode === 'login') {
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
      } else {
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('loginForm').style.display = 'none';
      }
    }

    function checkSavedTeam() {
      const savedName = localStorage.getItem("treasure_user_name");
      const savedTeam = localStorage.getItem("treasure_user_team");
      if (savedName && savedTeam) {
        document.getElementById("mySavedName").textContent = savedName;
        document.getElementById("mySavedTeam").textContent = savedTeam;
        document.getElementById("myTeamCard").style.display = "block";
        document.getElementById("authSection").style.display = "none";
      } else {
        document.getElementById("myTeamCard").style.display = "none";
        document.getElementById("authSection").style.display = "block";
      }
    }

    function logout() {
      if (confirm("確定要登出嗎？登出後可再次輸入帳密登入。")) {
        localStorage.removeItem("treasure_user_name");
        localStorage.removeItem("treasure_user_team");
        checkSavedTeam();
      }
    }

    async function submitRegister() {
      const name = document.getElementById("regName").value.trim();
      const teamName = document.getElementById("regTeam").value;
      const account = document.getElementById("regAcc").value.trim();
      const password = document.getElementById("regPwd").value.trim();
      const btn = document.getElementById("btnReg");

      if (!name || !account || !password) return alert("請填寫姓名、帳號與密碼！");

      btn.disabled = true;
      btn.textContent = "註冊驗證中，請稍候...";

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "register", name, teamName, account, password })
        });
        const result = await res.json();
        alert(result.message);
        if (result.status === "success") {
          localStorage.setItem("treasure_user_name", name);
          localStorage.setItem("treasure_user_team", teamName);
          checkSavedTeam();
          loadLeaderboard();
        }
      } catch (err) {
        alert("連線逾時，請再試一次！");
      } finally {
        btn.disabled = false;
        btn.textContent = "確定註冊並鎖定組別";
      }
    }

    async function submitLogin() {
      const account = document.getElementById("loginAcc").value.trim();
      const password = document.getElementById("loginPwd").value.trim();
      const btn = document.getElementById("btnLogin");

      if (!account || !password) return alert("請輸入帳號與密碼！");

      btn.disabled = true;
      btn.textContent = "登入驗證中...";

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "login", account, password })
        });
        const result = await res.json();
        alert(result.message);
        if (result.status === "success") {
          localStorage.setItem("treasure_user_name", account);
          localStorage.setItem("treasure_user_team", result.teamName);
          checkSavedTeam();
          loadLeaderboard();
        }
      } catch (err) {
        alert("登入連線失敗，請檢查網路後再試！");
      } finally {
        btn.disabled = false;
        btn.textContent = "登入鎖定組別";
      }
    }

    async function loadLeaderboard() {
      const tbody = document.getElementById("leaderboardBody");
      tbody.innerHTML = "<tr><td colspan='3'>戰績統計中...</td></tr>";

      try {
        const res = await fetch(`${GAS_URL}?action=getLeaderboard`);
        const result = await res.json();

        if (result.status === "success") {
          tbody.innerHTML = "";
          result.data.forEach(item => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td style="font-weight:bold;">${item.teamName}</td>
              <td style="color:#1a73e8; font-weight:bold;">🚩 ${item.hideCount} 個</td>
              <td style="font-weight:bold; color:#e65100; font-size:16px;">🎁 ${item.foundCount} 個</td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (e) {
        tbody.innerHTML = "<tr><td colspan='3'>無法讀取榜單，請點擊刷新</td></tr>";
      }
    }

    function getGPSLocation() {
      const gpsDiv = document.getElementById("gpsStatus");
      if (!navigator.geolocation) return gpsDiv.textContent = "手機不支援 GPS 定位";
      gpsDiv.textContent = "定位中，請稍候...";
      
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          gpsDiv.textContent = `✅ 定位成功！(緯度: ${currentLat.toFixed(5)}, 經度: ${currentLng.toFixed(5)})`;
          gpsDiv.style.color = "green";
        },
        (err) => { 
          gpsDiv.textContent = "❌ 定位超時，請確定手機已開啟 GPS 權限。"; 
          gpsDiv.style.color = "red"; 
        },
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 10000 }
      );
    }

    async function submitHideTreasure() {
      const savedTeam = localStorage.getItem("treasure_user_team");
      if (!savedTeam) return alert("請先完成註冊或登入鎖定組別！");
      const treasureName = document.getElementById("treasureName").value.trim();
      const hint = document.getElementById("treasureHint").value.trim();
      const password = document.getElementById("treasurePassword").value.trim();
      const btn = document.getElementById("btnHide");

      if (!treasureName || !hint || !password) return alert("請填寫寶物名稱、地點提示與解鎖密碼！");
      if (currentLat === 0) return alert("請先點擊按鈕抓取 GPS 位置！");

      btn.disabled = true;
      btn.textContent = "資料送出中...";

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "hideTreasure", teamName: savedTeam, treasureName, lat: currentLat, lng: currentLng, hint, password })
        });
        const result = await res.json();
        alert(result.message);
        if (result.status === "success") {
          document.getElementById("treasureName").value = "";
          document.getElementById("treasureHint").value = "";
          document.getElementById("treasurePassword").value = "";
          loadLeaderboard();
        }
      } catch (e) {
        alert("發布失敗，請重試！");
      } finally {
        btn.disabled = false;
        btn.textContent = "🚩 確定藏寶並送出定位";
      }
    }

    async function loadTreasuresAndCalculate() {
      const container = document.getElementById("treasuresList");
      const savedTeam = localStorage.getItem("treasure_user_team");
      container.innerHTML = "正在計算雷達距離與載入寶物...";

      let uLat = currentLat, uLng = currentLng;

      try {
        const pos = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 4000,
            maximumAge: 15000
          });
        });
        uLat = pos.coords.latitude;
        uLng = pos.coords.longitude;
        currentLat = uLat;
        currentLng = uLng;
      } catch (err) {
        console.warn("GPS 定位超時，改用快取或預設距離計算");
      }

      try {
        const res = await fetch(`${GAS_URL}?action=getTreasures`);
        const result = await res.json();
        if (result.status === "success") {
          container.innerHTML = "";
          result.data.forEach(item => {
            if (item.teamName === savedTeam) return;

            let distText = "無法計算";
            if (uLat !== 0 && uLng !== 0) {
              const distMeters = Math.round(getDistanceMeters(uLat, uLng, item.lat, item.lng));
              distText = `${distMeters} 公尺`;
            }

            const isFound = item.status.includes("已找到");

            const card = document.createElement("div");
            card.className = `treasure-item ${isFound ? 'found' : ''}`;
            card.innerHTML = `
              <div style="font-size:12px; color:#666;">來自【${item.teamName}】藏的寶物</div>
              <div style="font-size:18px; font-weight:bold; color:#1a73e8;">🎁 ${item.treasureName}</div>
              <div class="distance-tag">📡 距離目標：${distText}</div>
              <div style="font-size:14px; color:#333; margin-top:5px;"><strong>💡 地點提示：</strong>${item.hint}</div>
              <div style="font-size:13px; margin-top:6px; font-weight:bold; color:${isFound ? '#2e7d32' : '#e65100'};">狀態：${item.status}</div>
              <div style="margin-top:10px; display:flex; gap:8px;">
                <a href="https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}" target="_blank" style="flex:1; text-align:center; background:#e3f2fd; padding:6px; font-size:12px; color:#1a73e8; text-decoration:none; border-radius:5px;">🗺️ 導航</a>
                ${!isFound ? `<button onclick="markFound(${item.id}, '${item.teamName}')" style="flex:1; background:#4caf50; color:white; border:none; padding:6px; font-size:12px; border-radius:5px; cursor:pointer;">🔑 輸入密碼解鎖</button>` : ''}
              </div>
            `;
            container.appendChild(card);
          });
          if (container.innerHTML === "") container.innerHTML = "目前沒有其他組別藏的寶物";
        }
      } catch (e) {
        container.innerHTML = "讀取寶物失敗，請確認網路連線或重試。";
      }
    }

    async function markFound(treasureId, targetTeamName) {
      const savedTeam = localStorage.getItem("treasure_user_team");
      if (!savedTeam) return alert("請先完成註冊或登入鎖定組別！");

      const inputPassword = prompt(`請輸入【${targetTeamName}】實體寶物上的解鎖密碼：`);
      if (!inputPassword) return;

      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ 
          action: "foundTreasure", 
          treasureId: treasureId, 
          finderTeamName: savedTeam, 
          inputPassword 
        })
      });
      const result = await res.json();
      alert(result.message);
      if (result.status === "success") {
        loadTreasuresAndCalculate();
        loadLeaderboard();
      }
    }

    async function adminResetData(resetType) {
      const adminPassword = prompt("🔐 請輸入管理者重置密碼：");
      if (!adminPassword) return;

      const confirmMsg = resetType === 'ALL' ? "⚠️ 確定要全面重置？（會清除所有報名名單與藏寶紀錄）" : "確定要清空所有藏寶紀錄？";
      if (!confirm(confirmMsg)) return;

      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "adminReset", adminPassword, resetType })
      });
      const result = await res.json();
      alert(result.message);
      if (result.status === "success") {
        loadLeaderboard();
      }
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
  </script>
</body>
</html>
